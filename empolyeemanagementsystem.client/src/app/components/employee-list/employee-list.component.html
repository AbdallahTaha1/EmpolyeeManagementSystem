<div class="container mt-5">
  <div class="d-flex justify-content-between mb-3">
    <h2>Employee List</h2>
    <a routerLink="/create" class="btn btn-primary">Add Employee</a>
  </div>

  <table class="table table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Position</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let emp of employees">
        <td>{{ emp.id }}</td>
        <td>{{ emp.firstName }} {{ emp.lastName }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.position }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="onEdit(emp.id)">
            Edit
          </button>
          <button class="btn btn-sm btn-danger" (click)="onDelete(emp.id)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
